# E6 — multistability / hysteresis (PLAN §5-E6). Up/down I* continuation sweeps
# (hysteresis) + basin sampling with many ICs (coexisting attractors). Order
# parameter = <|omega|> (gross rotation rate, converges per ergodic attractor);
# |<omega>| distinguishes the CW/CCW symmetry pair.

experiment: e6_multistability
seed: 20260922
model_config: config/model_params.yaml

sweep_range:            # up/down continuation over the full regime sequence
  start: 1.10
  stop: 3.00
  step: 0.05

basin:                  # random-IC basin sampling at diagnostic I* points
  istar: [1.22, 1.40, 1.606, 1.67, 2.20, 2.50]   # transition, tumble, window, window, chaos, chaos
  n_ic: 12
  vel_scale: 1.5        # random reduced IC ~ (vx',vy') in [-scale,scale], theta in [0,2pi), omega in [-1,1]

trajectory:
  ic: [0.0, 0.01, 0.5, 0.0]   # spec IC (seeds the up-sweep)
  T: 1500.0
  transient: 500.0
  dt: 0.05

integrator:
  method: DOP853
  rtol: 1.0e-10
  atol: 1.0e-12

cluster:
  tol: 0.05             # <|omega|> gap (relative to scale) separating distinct attractors

sweep:
  n_jobs: -1

outputs:
  figure: figures/e6_multistability.png
